<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeremy Ortiz | Graphic Designer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Toolbar / Barra de Navegação Superior -->
  <header class="navbar">
    <div class="logo-name">JEREMY ORTIZ</div>
    <nav class="nav-links">
      <a href="#home">HOME</a>
      <a href="#about">ABOUT ME</a>
      <a href="#works">MY WORKS</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <!-- Hero Section (Imagem Fullscreen) -->
  <section id="home" class="hero-fullscreen">
    <!-- O conteúdo central fica dentro da própria imagem de fundo -->
  </section>

  <!-- Seção About Me -->
  <section id="about" class="section-container">
    <h2>ABOUT ME</h2>
    <p>Especialista em branding, comunicação visual de grande formato e artes digitais.</p>
  </section>

  <!-- Seção My Works (Galeria de Projetos) -->
  <section id="works" class="section-container">
    <h2>MY WORKS</h2>
    <div class="works-grid">
      <div class="work-card">
        <div class="png-holder">
          <img src="seu-projeto-1.png" alt="Projeto 1">
        </div>
        <h3>Branding & Wrapping</h3>
      </div>
      <div class="work-card">
        <div class="png-holder">
          <img src="seu-projeto-2.png" alt="Projeto 2">
        </div>
        <h3>Large Format Print</h3>
      </div>
      <div class="work-card">
        <div class="png-holder">
          <img src="seu-projeto-3.png" alt="Projeto 3">
        </div>
        <h3>Digital Design</h3>
      </div>
    </div>
  </section>

  <!-- Seção Contact -->
  <footer id="contact" class="section-container footer-section">
    <h2>CONTACT</h2>
    <p>Entre em contato para novos projetos e orçamentos.</p>
    <div class="contact-links">
      <a href="mailto:contato@jeremyortiz.com">EMAIL</a>
      <a href="#">INSTAGRAM</a>
      <a href="#">LINKEDIN</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
